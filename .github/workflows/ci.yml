name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The Haskell work and the `tools/` work are separate jobs with no dependency
  # between them, so they overlap instead of queueing. The `tools/` suite needs
  # no Haskell toolchain, and installing one for it put its whole runtime behind
  # a toolchain install it never used.
  haskell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The one place this workflow names the toolchain. The setup action, both
    # cache keys, and the verification below all read the pins from here, so a
    # bump cannot leave one of them behind; tools/test_toolchain_parity.py
    # holds this block against the identical one in release.yml's build-test
    # job, so a bump of one workflow alone cannot land either.
    env:
      GHC_VERSION: "9.12.2"
      CABAL_VERSION: "3.16.1.0"
    steps:
      - uses: actions/checkout@v6

      # ghcup installs under `$GHCUP_INSTALL_BASE_PREFIX/.ghcup`, and the
      # runner image points that at `/usr/local` -- a prefix this job does not
      # own, whose modes and timestamps a restore running as the runner user
      # cannot be relied on to reproduce, and which the image's `~/.ghcup`
      # already redirects into. So the installation is moved somewhere the job
      # owns outright and `~/.ghcup` is made a real directory of its own,
      # before anything reads or writes either. That path is also the one
      # `haskell-actions/setup` probes and puts on PATH, so the compiler the
      # cache restores is the compiler the build runs.
      - name: Establish a runner-owned compiler installation prefix
        run: |
          set -euo pipefail
          rm -rf "$HOME/.ghcup"
          mkdir -p "$HOME/.ghcup"
          echo "GHCUP_INSTALL_BASE_PREFIX=$HOME" >> "$GITHUB_ENV"

      # The compiler itself, which the package cache further down has never
      # covered: without this, `ghcup install ghc` unpacks and installs the
      # bindist from scratch on every run, which is about two minutes of every
      # one.
      #
      # The key partitions by everything the restored tree is only valid for --
      # runner OS, runner architecture, both pinned versions, and `v1`, the
      # installation layout established above. That last component is the lever
      # for invalidating every entry at once without touching a pin: bump it
      # when the prefix changes, when what is kept under it changes, or if a
      # restored installation ever stops being valid for the runner image it
      # was built on. It names no source file: the compiler does not change
      # when a module is added, and keying it on `kanban.cabal` would miss on
      # nearly every pull request.
      #
      # There are deliberately no `restore-keys`. A prefix match is by
      # definition a tree built for another pin or another layout, and a
      # compiler is not a thing to half-restore; a miss reinstalls, which is
      # slower and still correct. `actions/cache` saves in a post step gated on
      # `success()`, so a tree that fails the verification below is never
      # written back for the next run to restore.
      - name: Restore the pinned compiler
        uses: actions/cache@v5
        with:
          path: ~/.ghcup
          key: ghcup-home-v1-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      # Whether the compiler was restored or installed, what follows has to be
      # the pinned one. A restore that lost an executable bit or a symlink, and
      # a prefix redirect that silently did not take, both leave a setup step
      # reporting success over a build that would run something else -- so the
      # tools are executed here and made to say what they are, before the first
      # `cabal` invocation depends on them.
      - name: Verify the pinned toolchain
        run: |
          set -euo pipefail
          if [ -L "$HOME/.ghcup" ] || [ ! -d "$HOME/.ghcup" ]; then
            echo "$HOME/.ghcup is not the runner-owned directory this job established" >&2
            exit 1
          fi
          if ! ghc_path="$(command -v ghc)"; then
            echo "no ghc on PATH after setup" >&2
            exit 1
          fi
          if ! cabal_path="$(command -v cabal)"; then
            echo "no cabal on PATH after setup" >&2
            exit 1
          fi
          ghc_reported="$(ghc --numeric-version)"
          cabal_reported="$(cabal --numeric-version)"
          echo "ghc $ghc_reported at $ghc_path"
          echo "cabal $cabal_reported at $cabal_path"
          if [ "$ghc_reported" != "$GHC_VERSION" ]; then
            echo "ghc reports $ghc_reported, not the pinned $GHC_VERSION" >&2
            exit 1
          fi
          if [ "$cabal_reported" != "$CABAL_VERSION" ]; then
            echo "cabal reports $cabal_reported, not the pinned $CABAL_VERSION" >&2
            exit 1
          fi

      # `tmp` is where ghcup unpacks a bindist and `logs` is what it writes
      # while installing one. Neither is part of an installation, and on a cold
      # run the unpacked bindist alone is the size of the compiler, so dropping
      # them keeps the entry saved above to the installation itself.
      - name: Drop the installer's scratch directories
        run: rm -rf "$HOME/.ghcup/tmp" "$HOME/.ghcup/logs"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('kanban.cabal', 'cabal.project') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-

      - name: Check package metadata
        run: cabal check

      - name: Update package index
        run: cabal update

      - name: Build
        run: cabal build all

      - name: Haskell tests
        run: cabal test all --test-show-details=direct

      - name: Source distribution
        # tools/test_source_distribution.py builds a real `cabal sdist all`
        # archive, so it is the one member of the `tools/` suite that needs the
        # toolchain installed above; the toolchain-free job below collects it
        # too and it skips there. Absent that toolchain it states its missing
        # prerequisite and skips, which is the unpacked-release case rather
        # than a pass -- so in the job that exists to satisfy that prerequisite,
        # a skipped or uncollected result is a failure.
        run: |
          if ! report="$(python3 -m unittest tools.test_source_distribution 2>&1)"; then
            printf '%s\n' "$report"
            exit 1
          fi
          printf '%s\n' "$report"
          case "$report" in
            *skipped*)
              printf '%s\n' "The packaging gate skipped where its toolchain is installed." >&2
              exit 1
              ;;
            *"Ran 0 tests"*)
              printf '%s\n' "The packaging gate collected no test, so it checked nothing." >&2
              exit 1
              ;;
          esac

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The plugin bundle version gate in tools/test_claude_plugin.py and
          # tools/test_codex_plugin.py measures a change unit against its
          # default-branch merge base. The default depth-1 checkout has no
          # such base, and that gate fails rather than skipping when the
          # baseline is missing, so the history has to actually be here.
          fetch-depth: 0

      - name: Install the pinned rasteriser
        run: python3 -m pip install --user Pillow==12.2.0

      - name: Install the pinned fonts
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/dejavu-fonts-ttf-2.37.tar.bz2" \
            https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          mkdir -p "$HOME/.local/share/fonts/dejavu"
          tar --extract --bzip2 \
            --file "$RUNNER_TEMP/dejavu-fonts-ttf-2.37.tar.bz2" \
            --directory "$HOME/.local/share/fonts/dejavu" --strip-components=2 \
            dejavu-fonts-ttf-2.37/ttf/DejaVuSansMono.ttf \
            dejavu-fonts-ttf-2.37/ttf/DejaVuSansMono-Bold.ttf

      - name: Rendering probe for issue 422 evidence
        run: python3 -m unittest -v tools.test_board_screenshot

      - name: Tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  # The evidence for the drainer's Linux support, per
  # docs/linux_portability_design.md decision D-1: no Linux host is known to
  # exist for this project, so the claim is container-verified against a real
  # systemd user session rather than asserted from generated files. The whole
  # lifecycle runs — install, start (which is what exercises the backend's
  # kick), status, stop, uninstall — and each step is checked against durable
  # state in both the user manager and the discovery record. Only `gh` and the
  # provider executables are faked.
  systemd-drainer-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build the systemd image
        run: docker build --file .github/systemd-lifecycle/Dockerfile --tag kanban-systemd-lifecycle .

      - name: Boot systemd
        # systemd runs as PID 1 in the container, which is what gives it a
        # user manager to start; the cgroup mount and `--cgroupns=host` are
        # what let it manage one on a cgroup v2 runner.
        run: |
          docker run --detach --name kanban-systemd \
            --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            kanban-systemd-lifecycle

      - name: Wait for the user manager
        run: |
          for _ in $(seq 60); do
            if docker exec kanban-systemd systemctl is-active --quiet user@1001.service; then
              exit 0
            fi
            sleep 2
          done
          echo "user@1001.service never became active" >&2
          docker exec kanban-systemd systemctl status user@1001.service --no-pager || true
          exit 1

      - name: Run the drainer lifecycle
        # `systemctl start` on a oneshot blocks until the unit finishes and
        # exits nonzero if it failed, so the unit's own verdict is this step's.
        run: docker exec kanban-systemd systemctl start lifecycle-check.service

      - name: Lifecycle output
        if: always()
        run: docker exec kanban-systemd journalctl --unit=lifecycle-check.service --no-pager --output=cat || true

      - name: Stop systemd
        if: always()
        run: docker rm --force kanban-systemd || true

  # The single required CI context, and the only job here that other systems
  # name: `master`'s branch protection, `tools/drain_prs.py`'s one
  # `required_ci_check`, and the release gate in docs/design.md all resolve
  # exactly `build-test`. It therefore has to survive the split above and has
  # to mean "every job in this workflow succeeded", which it can only do by
  # deciding for itself: a dependency failure *skips* a dependent job, and a
  # skipped check is not a failed one to any of those readers. So it runs
  # under `if: always()` and refuses on any dependency result that is not
  # `success` -- including a job added later, which
  # tools/test_ci_workflow.py requires to appear in `needs` below.
  #
  # The one outcome this cannot cover is the run being cancelled as a whole,
  # which `cancel-in-progress` above does on every superseded push: GitHub
  # cancels a job that has not started, and no job-level `if:` can turn that
  # into a conclusion this job reports.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [haskell, python, systemd-drainer-lifecycle]
    steps:
      - name: Require every other job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS"])
          if not results:
              sys.exit("build-test depends on no job, so it gates nothing.")

          refused = []
          for job in sorted(results):
              result = results[job].get("result")
              print(f"{job}: {result}")
              if result != "success":
                  refused.append(f"{job} reported {result}")

          if refused:
              sys.exit("Refusing: " + ", ".join(refused) + ".")

          print(f"Every job in this workflow succeeded ({len(results)} of them).")
          PY
