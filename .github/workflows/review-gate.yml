name: Review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  review-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a current reviewed:approve label
        env:
          HAS_CURRENT_APPROVAL: ${{ contains(github.event.pull_request.labels.*.name, 'reviewed:approve') }}
        run: |
          if [ "$HAS_CURRENT_APPROVAL" = "true" ]; then
            echo "the pull request currently has reviewed:approve"
          else
            echo "a current reviewed:approve verdict is required"
            exit 1
          fi

  # New commits that touch this pull request's own files invalidate a prior
  # approval: strip the label so the gate closes until a reviewer approves the
  # updated code. The removal fires an `unlabeled` event, which re-runs
  # review-approved. A synchronize push that touches none of the files this
  # pull request changed, either before or after the push -- a base-branch
  # update merged forward with no overlapping content -- leaves the label
  # alone: the reviewed code has not changed, only the branch's ancestry has.
  # Both file sets count because the post-push one alone forgets a reviewed
  # file the push reverted to its base contents, or one the pull request added
  # and the push deleted. File names are compared byte for byte, so a name
  # Git would quote or escape is matched like any other.
  #
  # Keeping the label is the ONLY positive content-safe signal this repository
  # publishes, and the drainer reads it as one (`tools/drain_prs.py`,
  # branch_update_carried_approval). So this job runs on every synchronize
  # rather than only on an already-approved payload: a run skipped for a later
  # push would leave an earlier run's success as the latest non-skipped
  # result, and that stale success would speak for a head it never saw.
  dismiss-stale-approval:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pushed branch with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Remove approval unless this push touches no PR-owned file
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          strip() {
            # A suppressed removal failure would be the whole bug back again:
            # this job succeeding with reviewed:approve still attached is
            # precisely what the drainer reads as "this push was content-safe".
            # So the removal is confirmed rather than assumed, and a strip that
            # did not happen fails the job instead of reporting a decision the
            # label does not reflect. The attempt itself is allowed to fail --
            # the job runs on unapproved synchronizes too, where there is no
            # label to remove -- because only the state afterwards decides.
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label reviewed:approve || true
            if ! remaining=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name'); then
              echo "couldn't read this PR's labels back -- the removal is unconfirmed, failing"
              exit 1
            fi
            if printf '%s\n' "$remaining" | grep -qx 'reviewed:approve'; then
              echo "reviewed:approve is still attached after the removal attempt -- failing"
              exit 1
            fi
            echo "reviewed:approve is not attached"
          }
          # Every case that cannot positively prove non-overlap strips. This
          # only ever SKIPS a strip when the push is provably content-free for
          # this pull request, never the reverse.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable 'before' SHA -- can't confirm this is a no-op update, stripping"
            strip
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "'before' SHA not reachable in this checkout -- can't confirm, stripping"
            strip
            exit 0
          fi
          if [ -z "$AFTER" ] || [ "$AFTER" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable 'after' SHA -- can't confirm this is a no-op update, stripping"
            strip
            exit 0
          fi
          if ! git cat-file -e "$AFTER^{commit}" 2>/dev/null; then
            echo "'after' SHA not reachable in this checkout -- can't confirm, stripping"
            strip
            exit 0
          fi
          # Every file list below comes straight from Git, NUL-delimited and
          # with rename detection off, so each names a path exactly as Git
          # stores it -- no quoting, escaping, or newline splitting to
          # reconcile between lists -- and a rename counts both its paths.
          lists=$(mktemp -d)
          trap 'rm -rf "$lists"' EXIT
          names() {
            git diff --no-ext-diff --no-renames --name-only -z "$@"
          }
          if ! names "$BEFORE" "$AFTER" > "$lists/drift"; then
            echo "couldn't diff 'before'..'after' -- can't confirm, stripping"
            strip
            exit 0
          fi
          if [ ! -s "$lists/drift" ]; then
            echo "push introduced no file changes -- stripping (unexpected, be safe)"
            strip
            exit 0
          fi
          # The pull request's own files are read at BOTH ends of the push,
          # each against the base branch the way GitHub computes a pull
          # request's diff: from where that head meets the base to the head.
          # The post-push list alone would lose a reviewed file this push
          # reverted to its base contents, or a file the pull request added
          # and this push deleted. Measuring each end from its own meeting
          # point keeps a base branch that has advanced since from lending the
          # pull request files it never changed.
          base_tip="refs/remotes/origin/$BASE_REF"
          if [ -z "$BASE_REF" ] || ! git rev-parse --quiet --verify "$base_tip^{commit}" >/dev/null; then
            echo "base branch '$BASE_REF' isn't in this checkout -- can't establish this PR's own files, stripping"
            strip
            exit 0
          fi
          for side in before after; do
            if [ "$side" = before ]; then head=$BEFORE; else head=$AFTER; fi
            if ! fork=$(git merge-base "$base_tip" "$head"); then
              echo "the '$side' head shares no history with '$BASE_REF' -- can't establish this PR's own files $side the push, stripping"
              strip
              exit 0
            fi
            if ! names "$fork" "$head" > "$lists/$side"; then
              echo "couldn't diff this PR's own files $side the push -- can't confirm, stripping"
              strip
              exit 0
            fi
            if [ ! -s "$lists/$side" ]; then
              echo "this PR changes no files of its own $side the push -- nothing to prove non-overlap against, stripping"
              strip
              exit 0
            fi
          done
          # Byte-exact set intersection; any failure here strips as well.
          if ! overlap=$(python3 - "$lists/before" "$lists/after" "$lists/drift" <<'PY'
          import sys

          def names(path):
              with open(path, "rb") as handle:
                  return {name for name in handle.read().split(b"\0") if name}

          before, after, drift = (names(path) for path in sys.argv[1:])
          for name in sorted((before | after) & drift):
              print(ascii(name.decode("utf-8", "backslashreplace")))
          PY
          ); then
            echo "couldn't compare this push with this PR's own files -- can't confirm, stripping"
            strip
            exit 0
          fi
          if [ -n "$overlap" ]; then
            echo "push touched PR-owned file(s): $overlap -- stripping"
            strip
          else
            echo "push touched no PR-owned files (branch-update merge) -- keeping reviewed:approve"
          fi
